import org.gradle.api.tasks.testing.logging.TestExceptionFormat

buildscript {
    dependencyLocking {
        lockAllConfigurations()
        lockMode = LockMode.STRICT
    }
}

plugins {
    id 'java'
    alias(libs.plugins.shadow)
}

group = 'io.kaleido'

sourceSets {
    integrationTest {
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
}

configurations {
    integrationTestImplementation.extendsFrom implementation

    // Resolvable configurations
    toolkitProtoDefinitions {
        canBeConsumed = false
        canBeResolved = true
    }
    libcore {
        canBeConsumed = false
        canBeResolved = true
    }
    compiledContracts {
        canBeConsumed = false
        canBeResolved = true
    }
}

jar {
    destinationDirectory = layout.buildDirectory.dir('thin-libs')
}

shadowJar {
    dependsOn ':solidity:compile'

    if (project.hasProperty('jarVersion')) {
        archiveVersion = project.jarVersion
    } else {
        archiveVersion = ''
    }

    archiveBaseName = 'pente'  // Base name of the JAR, the version will be added to this
    archiveClassifier = ''

    from(project.configurations.compiledContracts) {
        include 'contracts/domains/pente/PenteFactory.sol/PenteFactory.json'
        include 'contracts/domains/pente/PentePrivacyGroup.sol/PentePrivacyGroup.json'
        include 'contracts/domains/interfaces/IPente.sol/IPente.json'
        include 'contracts/domains/interfaces/IPenteExternalCall.sol/IPenteExternalCall.json'
    }

    mergeServiceFiles()

    exclude 'io/kaleido/paladin/logging/**'
}

assemble.dependsOn shadowJar

test {
    testLogging {
        testLogging {
            events("passed", "skipped", "failed")
            showStackTraces = true
            exceptionFormat = TestExceptionFormat.FULL
        }
    }
    useJUnitPlatform()
    finalizedBy 'integrationTest'
}

tasks.register('integrationTest', Test) {
    description = 'Runs the testbed tests, with the Pente domain loaded from the built jar.'
    group = 'verification'
    testClassesDirs = sourceSets.integrationTest.output.classesDirs
    classpath = sourceSets.integrationTest.runtimeClasspath
    testLogging {
        testLogging {
            events("passed", "skipped", "failed")
            showStackTraces = true
            exceptionFormat = TestExceptionFormat.FULL
        }
    }
    useJUnitPlatform()
    systemProperty "jna.library.path", [
        new File(project(":core:go").buildDir, "libs").absolutePath,
        new File(project(":toolkit:go").buildDir, "libs").absolutePath,
        new File(project(":domains:noto").buildDir, "libs").absolutePath
    ].join(File.pathSeparator)
    dependsOn ':testinfra:startTestInfra'
    dependsOn shadowJar
    systemProperty "pente.jar", shadowJar.archiveFile.get().asFile.absolutePath
}

repositories {
    maven {
        url 'https://hyperledger.jfrog.io/hyperledger/besu-maven'
        content { includeGroupByRegex('org\\.hyperledger\\..*') }
    }
    maven {
        url 'https://artifacts.consensys.net/public/maven/maven/'
        content { includeGroupByRegex('tech\\.pegasys(\\..*)?') }
    }
    maven {
        url "https://plugins.gradle.org/m2/"
    }
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

dependencies {
    constraints {
        implementation(libs.guava) {
            because 'CVE-2026-102554: earlier Guava versions allow a denial of service through deserialization'
        }
    }

    implementation libs.grpc.protobuf
    implementation libs.grpc.services
    implementation libs.grpc.stub
    implementation libs.grpc.netty
    implementation libs.protobuf.java.util
    implementation libs.jackson.dataformat.yaml

    implementation libs.netty.all
    compileOnly libs.log4j.core

    testImplementation project(path: ":solidity", configuration: "compiledContracts")

    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.slf4j.reload4j
    testImplementation libs.jackson.databind
    testImplementation libs.jsonassert
    testImplementation libs.log4j.core

    integrationTestImplementation project(path: ":core:java")
    integrationTestImplementation project(path: ":solidity", configuration: "compiledContracts")
    integrationTestImplementation project(path: ":core:go", configuration: "libcore")
    integrationTestImplementation project(path: ":domains:noto", configuration: "libnoto")

    integrationTestImplementation platform(libs.junit.bom)
    integrationTestImplementation libs.junit.jupiter
    integrationTestImplementation libs.jackson.databind

    implementation libs.besu.evm
    implementation libs.besu.datatypes
    implementation libs.besu.trie

    implementation libs.web3j.rlp
    implementation libs.web3j.core

    implementation libs.commons.io
    implementation libs.tuweni.bytes
    implementation libs.tuweni.units

    implementation project(path: ":toolkit_java")

    compiledContracts project(path: ":solidity", configuration: "compiledContracts")

}
