buildscript {
    dependencyLocking {
        lockAllConfigurations()
        lockMode = LockMode.STRICT
    }
}

plugins {
    id 'java'
    alias(libs.plugins.protobuf)
}

group = 'io.kaleido'

repositories {
    mavenCentral()
}

dependencyLocking {
    lockAllConfigurations()
    lockMode = LockMode.STRICT
}

test {
    testLogging {
        showStandardStreams = true
    }
    useJUnitPlatform()
}

configurations {
    // Resolvable configurations
    toolkitProtoDefinitions {
        canBeConsumed = false
        canBeResolved = true
    }
}

tasks.register('collectProtocFiles', Copy) {
    from configurations.toolkitProtoDefinitions.asFileTree
    into "src/main/proto"
}

tasks.register('cleanProto', Delete) {
    delete 'src/main/proto'
}

tasks.named('generateProto') {
    dependsOn 'collectProtocFiles'
}

tasks.named('processResources') {
    dependsOn 'generateProto'
}

tasks.named('clean') {
    dependsOn tasks.cleanProto
}

tasks.register("protoc") {
    dependsOn tasks.generateProto
}

dependencies {
    constraints {
        implementation(libs.guava) {
            because 'CVE-2026-102554: earlier Guava versions allow a denial of service through deserialization'
        }
    }

    // GRPC and Protobuf dependencies
    implementation libs.grpc.protobuf
    implementation libs.grpc.services
    implementation libs.grpc.stub
    implementation libs.grpc.netty

    implementation libs.bcprov
    implementation libs.netty.all
    implementation libs.jackson.dataformat.yaml

    compileOnly libs.log4j.core

    toolkitProtoDefinitions project(path: ":toolkit:proto", configuration: "protoDefinitions")

    implementation libs.jna.platform
    implementation libs.protobuf.java.util

    compileOnly libs.tomcat.annotations.api

    // Test dependencies
    testImplementation project(path: ":solidity", configuration: "compiledContracts")
    testImplementation platform(libs.junit.bom)
    testImplementation libs.junit.jupiter
    testImplementation libs.jsonassert
    testRuntimeOnly libs.log4j.core
}

protobuf {
    protoc { artifact = "com.google.protobuf:protoc:${libs.versions.protobuf.asProvider().get()}" }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${libs.versions.grpc.get()}"
        }
    }
    generateProtoTasks {
        all()*.plugins { grpc {} }
    }
}

tasks.named('assemble') {
    // this package is not intended to be built independently
    enabled = false
}