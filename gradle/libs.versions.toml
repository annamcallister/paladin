# One catalog for all Java components, at Gradle's default location, because Dependabot only reads a catalog from there.
# A component that needs a different version of a shared library gets its own version entry for it.

[versions]
besu = "24.5.4"
bouncycastle = "1.78.1"
commons-io = "2.16.1"
grpc = "1.69.1"
guava = "33.8.0-jre"
jackson = "2.18.9"
jna = "5.14.0"
jsonassert = "1.5.3"
junit = "5.9.3"
log4j = "2.25.4"
netty = "4.1.140.Final"
protobuf = "4.29.6"
protobuf-plugin = "0.9.4"
shadow = "8.3.9"
slf4j = "2.0.20"
tomcat-annotations = "6.0.53"
tuweni = "2.4.2"
web3j = "4.14.0"

[libraries]
bcprov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
besu-datatypes = { module = "org.hyperledger.besu:besu-datatypes", version.ref = "besu" }
besu-evm = { module = "org.hyperledger.besu:evm", version.ref = "besu" }
besu-trie = { module = "org.hyperledger.besu.internal:trie", version.ref = "besu" }
commons-io = { module = "commons-io:commons-io", version.ref = "commons-io" }
grpc-api = { module = "io.grpc:grpc-api", version.ref = "grpc" }
grpc-netty = { module = "io.grpc:grpc-netty", version.ref = "grpc" }
grpc-protobuf = { module = "io.grpc:grpc-protobuf", version.ref = "grpc" }
grpc-services = { module = "io.grpc:grpc-services", version.ref = "grpc" }
grpc-stub = { module = "io.grpc:grpc-stub", version.ref = "grpc" }
guava = { module = "com.google.guava:guava", version.ref = "guava" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jackson-dataformat-yaml = { module = "com.fasterxml.jackson.dataformat:jackson-dataformat-yaml", version.ref = "jackson" }
jna-platform = { module = "net.java.dev.jna:jna-platform", version.ref = "jna" }
jsonassert = { module = "org.skyscreamer:jsonassert", version.ref = "jsonassert" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
log4j-core = { module = "org.apache.logging.log4j:log4j-core", version.ref = "log4j" }
netty-all = { module = "io.netty:netty-all", version.ref = "netty" }
protobuf-java-util = { module = "com.google.protobuf:protobuf-java-util", version.ref = "protobuf" }
slf4j-reload4j = { module = "org.slf4j:slf4j-reload4j", version.ref = "slf4j" }
tomcat-annotations-api = { module = "org.apache.tomcat:annotations-api", version.ref = "tomcat-annotations" }
tuweni-bytes = { module = "io.tmio:tuweni-bytes", version.ref = "tuweni" }
tuweni-units = { module = "io.tmio:tuweni-units", version.ref = "tuweni" }
web3j-core = { module = "org.web3j:core", version.ref = "web3j" }
web3j-rlp = { module = "org.web3j:rlp", version.ref = "web3j" }

[plugins]
protobuf = { id = "com.google.protobuf", version.ref = "protobuf-plugin" }
shadow = { id = "com.gradleup.shadow", version.ref = "shadow" }
