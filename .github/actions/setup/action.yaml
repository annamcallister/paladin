name: 'Install pre-requisites'
description: 'Install pre-requisites for building paladin'

runs:
  using: 'composite'
  steps:
  - name: Install protoc
    shell: bash
    run: |
      curl -LO https://github.com/protocolbuffers/protobuf/releases/download/v25.1/protoc-25.1-linux-x86_64.zip
      unzip protoc-25.1-linux-x86_64.zip -d protoc
      echo "${PWD}/protoc/bin" >> $GITHUB_PATH
      rm protoc-25.1-linux-x86_64.zip

  # Set up Java
  - name: Setup Java
    uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
    with:
      distribution: 'temurin'
      java-version: 21

  # Set up Node (UI client build + Playwright e2e)
  - name: Setup Node
    uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
    with:
      node-version: '20'
      cache: 'npm'
      cache-dependency-path: |
        ui/**/package-lock.json

  # Set up Go
  - name: Set up Go
    uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
    with:
      go-version: '1.26'
      check-latest: true
      cache-dependency-path: |
        **/*.sum

  # Set up Gradle
  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@48b5f213c81028ace310571dc5ec0fbbca0b2947 # v4.4.3